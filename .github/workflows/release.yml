name: release

# v로 시작하는 태그(예: v0.1.0)를 푸시하면 실행된다.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# 같은 태그로 워크플로가 중복 실행되면 두 실행의 산출물이 섞여 latest.json 의 서명과
# 실제 업로드된 자산이 어긋난다(v0.1.8 macOS 업데이트 실패의 원인).
# 취소하지 않고 순차 실행시켜, 뒤 실행이 앞 실행의 최종 latest.json 위에 병합하게 한다.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # 릴리스를 **먼저 하나만** 만들고 그 id 를 빌드 잡들에 넘긴다.
  #
  # 이게 없으면 각 빌드 잡이 "태그로 draft 를 찾고 없으면 생성"을 각자 수행하는데,
  # draft 릴리스는 같은 태그로 여러 개 만들 수 있어 두 잡이 서로 다른 릴리스에
  # 자산을 올린다. 그러면 publish 가 그중 하나만 공개해 나머지 플랫폼이 통째로
  # 누락된다(v0.1.12 에서 macOS 자산이 사라진 원인).
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.mk.outputs.result }}
    steps:
      - uses: actions/github-script@v7
        id: mk
        env:
          TAG: ${{ github.ref_name }}
        with:
          script: |
            const tag = process.env.TAG
            // 재실행 대비: 이미 있으면 그것을 재사용한다.
            const list = await github.rest.repos.listReleases({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            })
            const found = list.data.find((r) => r.tag_name === tag)
            if (found) {
              core.info(`기존 릴리스 재사용: id=${found.id}`)
              return found.id
            }
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name: `DB Studio ${tag}`,
              body: "자산(Assets)에서 설치 파일을 내려받으세요. 설치된 앱은 이후 자동으로 업데이트됩니다.",
              draft: true,
              prerelease: false,
            })
            core.info(`릴리스 생성: id=${data.id}`)
            return data.id
          result-encoding: string

  build:
    needs: create-release
    permissions:
      contents: write # 릴리스 생성/자산 업로드
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS: Intel + Apple Silicon 모두 지원하는 유니버설 바이너리
          - platform: macos-latest
            args: "--target universal-apple-darwin"
            rust-targets: "aarch64-apple-darwin,x86_64-apple-darwin"
          # Windows: .msi / .exe(NSIS)
          - platform: windows-latest
            args: ""
            rust-targets: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Node 설치
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Rust 설치
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Rust 캐시
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: 프론트엔드 의존성 설치
        run: npm ci

      - name: 빌드 · 서명 · 릴리스
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 업데이트 아티팩트 서명(minisign) — 필수
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # macOS 코드사이닝을 켜려면 아래 블록의 주석을 해제하고 GitHub Secrets 를 등록한다.
          # (빈 값이면 tauri-action 이 빈 인증서를 import 하려다 실패하므로, 인증서가 있을 때만 추가할 것)
          # APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          # APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          # APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          # create-release 가 만든 릴리스에만 올린다(잡마다 새로 만들지 않도록).
          releaseId: ${{ needs.create-release.outputs.release_id }}
          # releaseId 가 있으면 tauri-action 은 릴리스를 만들지 않고(`index.ts`: `if (tagName && !releaseId)`)
          # 이 태그를 latest.json 의 다운로드 URL 을 짓는 데만 쓴다.
          # **빼면 안 된다** — draft 자산의 URL 은 `/download/untagged-<hash>/` 인데
          # tauri-action 은 tagName 이 없으면 이걸 `/latest/download/` 로 치환한다.
          # 그 URL 은 항상 "가장 최신 릴리스"를 가리키므로, 파일명에 버전이 없는
          # macOS 자산(DB.Studio_universal.app.tar.gz)은 다음 릴리스가 나오는 순간
          # 다른 버전 파일을 내려받게 되어 minisign 검증이 깨진다(v0.1.13 publish 실패).
          tagName: ${{ github.ref_name }}
          args: ${{ matrix.args }}

  # 업데이터가 실제로 쓰는 latest.json 이 릴리스에 올라간 .sig 와 일치하는지 확인한 뒤에만 공개한다.
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # 릴리스 draft 해제
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ github.ref_name }}
    steps:
      - name: 업데이터 자산 내려받기
        run: gh release download "$TAG" --repo "$GITHUB_REPOSITORY" -p 'latest.json' -p '*.sig' -D verify

      - name: latest.json 서명 정합성 검증
        run: |
          python3 - <<'PY'
          import json, os, pathlib, sys
          from urllib.parse import unquote

          d = pathlib.Path("verify")
          data = json.loads((d / "latest.json").read_text())
          tag = os.environ["TAG"]
          errors = []

          if data["version"] != tag.lstrip("v"):
              errors.append(f'latest.json version={data["version"]} 이 태그 {tag} 와 다름')

          # 플랫폼이 통째로 빠지면 그 OS 사용자는 업데이트를 받지 못한다.
          # 서명만 대조하면 "없는 항목"은 검사 대상이 아니라 그냥 통과해 버린다(v0.1.12 사고).
          REQUIRED = ["darwin-aarch64", "darwin-x86_64", "windows-x86_64"]
          for need in REQUIRED:
              if need not in data["platforms"]:
                  errors.append(f"{need} 항목이 latest.json 에 없음 — 해당 OS 빌드가 누락됐다")

          for name, p in data["platforms"].items():
              url = p["url"]
              # /latest/download/ 는 "가장 최신 릴리스"를 따라다니는 URL 이라
              # 다음 릴리스가 나오면 이 버전의 서명과 어긋난다. tagName 누락의 신호다.
              if "/releases/latest/download/" in url:
                  errors.append(
                      f"{name}: url 이 태그가 아닌 /latest/download/ 를 가리킴 — "
                      f"build 잡의 tagName 입력이 빠졌는지 확인 -> {url}"
                  )
              elif f"/download/{tag}/" not in url:
                  errors.append(f"{name}: url 이 {tag} 가 아닌 다른 릴리스를 가리킴 -> {url}")
              sig = d / (unquote(url.rsplit("/", 1)[-1]) + ".sig")
              if not sig.exists():
                  errors.append(f"{name}: 서명 파일 없음 ({sig.name})")
              elif sig.read_text().strip() != p["signature"].strip():
                  errors.append(f"{name}: latest.json 서명이 {sig.name} 과 불일치 (중복 실행으로 자산이 섞였을 수 있음)")

          if errors:
              print("업데이터 아티팩트 검증 실패:", *errors, sep="\n  - ")
              sys.exit(1)
          print(f"플랫폼 {len(data['platforms'])}개 서명 정합성 확인 완료")
          PY

      - name: 릴리스 공개
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
